name = "agentsweb"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "agentsweb.org"
custom_domain = true

[[routes]]
pattern = "api.agentsweb.org"
custom_domain = true

[[kv_namespaces]]
binding = "CACHE"
id = "fa20a13348bf4f0ab7289dbad534ec11"

# Every six hours, refresh 20 entries in order of last attempt, then clean up.
[triggers]
crons = ["0 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "agentsweb-index"
database_id = "a39a40d9-b56a-4b9d-b26f-d8c7bbc2c160"
migrations_dir = "migrations"

[[queues.producers]]
binding = "REVALIDATE"
queue = "agentsweb-revalidate"

[[queues.consumers]]
queue = "agentsweb-revalidate"
max_batch_size = 2
max_batch_timeout = 5
max_retries = 3

[observability]
enabled = true
head_sampling_rate = 0.1

[env.preview]
name = "agentsweb-preview"
workers_dev = true
preview_urls = true
routes = []

[[env.preview.kv_namespaces]]
binding = "CACHE"
id = "67f78d7c7f524bcaaa86e0cde82b861b"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "agentsweb-preview-index"
database_id = "6c2c37e7-b9b0-48ad-9904-31ad72414c26"
migrations_dir = "migrations"

[[env.preview.queues.producers]]
binding = "REVALIDATE"
queue = "agentsweb-preview-revalidate"

[[env.preview.queues.consumers]]
queue = "agentsweb-preview-revalidate"
max_batch_size = 2
max_batch_timeout = 5
max_retries = 3

[env.preview.triggers]
crons = []
